<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#3157e5">
<title>Página no encontrada | TecnoNexo</title>
<style>
:root{color-scheme:light;--ink:#162033;--muted:#59677e;--blue:#3157e5;--cyan:#22bfc2;--line:#e2e8f0;--navy:#111b32}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;background:#f5f7fb;color:var(--ink);font:16px/1.7 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header,footer{background:var(--navy);color:#e8edff;padding:18px 0} .wrap{width:min(900px,92%);margin:auto}
.brand{color:white;text-decoration:none;font-size:1.25rem;font-weight:850}
main{display:grid;place-items:center;padding:40px 0}.panel{width:min(650px,100%);background:white;border:1px solid var(--line);border-radius:22px;padding:clamp(24px,5vw,42px);text-align:center;box-shadow:0 12px 35px #1620330d}
.code{display:inline-block;color:#294bd1;background:#e8edff;border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:800}
h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.15;letter-spacing:-1px;margin:16px 0}
p{color:var(--muted)}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}
a.action{display:inline-block;padding:11px 17px;border-radius:11px;font-weight:750;text-decoration:none}
.primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:white}.secondary{border:1px solid var(--line);color:var(--ink)}
footer p{font-size:.9rem;color:#b9c3dd;margin:0}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="/">TecnoNexo</a></div></header>
<main><section class="panel" aria-labelledby="titulo"><span class="code">Error 404</span><h1 id="titulo">No encontramos esa página</h1><p>Puede que la dirección haya cambiado o que el enlace esté escrito incorrectamente. Puedes volver al inicio o consultar nuestras guías.</p><div class="actions"><a class="action primary" href="/">Ir al inicio</a><a class="action secondary" href="/#guias">Ver las guías</a></div></section></main>
<footer><div class="wrap"><p>TecnoNexo · Tecnología práctica, explicada con claridad.</p></div></footer>
</body>
</html>
